<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Pokédex competitiva: estadísticas, tier list, sinergias, equipos y combates con datos de Smogon, PokeAPI y Pokémon Showdown.">
  <meta name="theme-color" content="#070b17">
  <title>Apex Dex</title>

  <!-- Para instalarla como app (PWA): manifiesto, iconos y aspecto en el iPhone -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="img/icono-192.png" type="image/png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Apex Dex">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- API web: Google Fonts, para las tipografías -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="css/estilos.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="app">
    <main id="vista" aria-live="polite">
      <div class="tarjeta cargando"><div class="giro" aria-hidden="true"></div><p>Abriendo Apex Dex…</p></div>
    </main>
    <noscript><p class="tarjeta aviso">Apex Dex necesita JavaScript para funcionar.</p></noscript>
  </div>

  <nav class="barra-inferior" aria-label="Secciones">
    <div class="botones">
      <a href="#/inicio" data-seccion="inicio">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        Home
      </a>
      <a href="#/equipos" data-seccion="equipos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M15.5 14.2A5 5 0 0 1 21 19"/></svg>
        Equipos
      </a>
      <a href="#/dex" data-seccion="dex">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-6M11 20V8M17 20V4M3 20h18"/></svg>
        Stats &amp; Dex
      </a>
      <a href="#/matches" data-seccion="matches">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3a3 3 0 0 1-3 4M7 5H4a3 3 0 0 0 3 4"/></svg>
        Matches
      </a>
      <a href="#/perfil" data-seccion="perfil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>
        Perfil
      </a>
    </div>
  </nav>

  <div id="actualizacion" class="actualizacion" role="status" hidden>
    <p>Hay una versión nueva de Apex Dex</p>
    <button type="button" class="boton pequeno">Actualizar</button>
  </div>
  <p id="aviso-flotante" class="aviso-flotante" role="status"></p>

  <!-- Sugerencias para los campos de texto (se rellenan desde JavaScript la primera vez que hacen falta) -->
  <datalist id="lista-pokemon"></datalist>
  <datalist id="lista-movimientos"></datalist>
  <datalist id="lista-objetos"></datalist>
</body>
</html>
